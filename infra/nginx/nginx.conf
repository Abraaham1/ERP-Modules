worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Each upstream can later be scaled to multiple replicas
    # (e.g. `docker compose up --scale auth-service=3`) and nginx
    # will round-robin across them automatically.
    upstream auth_upstream {
        server auth-service:8000;
    }

    upstream attendance_upstream {
        server attendance-service:8000;
    }

    upstream payroll_upstream {
        server payroll-service:8000;
    }

    server {
        listen 80;

        location /api/auth/ {
            proxy_pass http://auth_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/attendance/ {
            proxy_pass http://attendance_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/payroll/ {
            proxy_pass http://payroll_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 200 "ERP Modules API Gateway\n";
            add_header Content-Type text/plain;
        }
    }
}
