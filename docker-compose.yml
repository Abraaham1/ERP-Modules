name: erp-modules

networks:
  erp-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

services:
  # ---------------------------------------------------------------
  # Infra
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_password}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_admin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - erp-net

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - erp-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: erp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-erp_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-erp_password}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - erp-net

  nginx:
    image: nginx:1.27-alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - attendance-service
      - payroll-service
    networks:
      - erp-net

  # ---------------------------------------------------------------
  # Services
  # ---------------------------------------------------------------
  auth-service:
    build:
      context: ./services/auth-service
    container_name: erp-auth-service
    restart: unless-stopped
    env_file:
      - ./services/auth-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erp_admin}:${POSTGRES_PASSWORD:-erp_password}@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp_admin}:${RABBITMQ_PASSWORD:-erp_password}@rabbitmq:5672/
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-net
    volumes:
      - ./services/auth-service:/app

  auth-email-worker:
    build:
      context: ./services/auth-service
    container_name: erp-auth-email-worker
    restart: unless-stopped
    command: python -m app.worker
    env_file:
      - ./services/auth-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erp_admin}:${POSTGRES_PASSWORD:-erp_password}@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp_admin}:${RABBITMQ_PASSWORD:-erp_password}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-net
    volumes:
      - ./services/auth-service:/app

  attendance-service:
    build:
      context: ./services/attendance-service
    container_name: erp-attendance-service
    restart: unless-stopped
    env_file:
      - ./services/attendance-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erp_admin}:${POSTGRES_PASSWORD:-erp_password}@postgres:5432/attendance_db
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp_admin}:${RABBITMQ_PASSWORD:-erp_password}@rabbitmq:5672/
      AUTH_SERVICE_URL: http://auth-service:8000
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-net
    volumes:
      - ./services/attendance-service:/app

  payroll-service:
    build:
      context: ./services/payroll-service
    container_name: erp-payroll-service
    restart: unless-stopped
    env_file:
      - ./services/payroll-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erp_admin}:${POSTGRES_PASSWORD:-erp_password}@postgres:5432/payroll_db
      REDIS_URL: redis://redis:6379/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp_admin}:${RABBITMQ_PASSWORD:-erp_password}@rabbitmq:5672/
      AUTH_SERVICE_URL: http://auth-service:8000
      ATTENDANCE_SERVICE_URL: http://attendance-service:8000
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-net
    volumes:
      - ./services/payroll-service:/app

  frontend:
    build:
      context: ./frontend
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8090
    networks:
      - erp-net
    volumes:
      - ./frontend:/app
      - /app/node_modules
